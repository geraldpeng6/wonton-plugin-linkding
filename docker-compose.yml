# Linkding 书签：网页经核心网关，登录走 OIDC；出网抓书签的标题和图标。
# 上游 MIT，镜像按清单列表（index）的摘要固定。
name: linkding


services:
  linkding:
    image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    # bootstrap.sh 以 root 建 data、跑迁移后启动 uwsgi（uwsgi.ini 固定 uid/gid www-data）。
    # 不写 user：核心按“没写 user”把数据目录交给 PUID:PGID，容器内 bootstrap 再 chown 给 www-data。
    environment:
      LD_ENABLE_OIDC: "True"
      # 端点地址由核心注入，不自己拼。
      OIDC_OP_AUTHORIZATION_ENDPOINT: ${WONTON_OIDC_AUTH_URL}
      OIDC_OP_TOKEN_ENDPOINT: ${WONTON_OIDC_TOKEN_URL}
      OIDC_OP_USER_ENDPOINT: ${WONTON_OIDC_USERINFO_URL}
      OIDC_OP_JWKS_ENDPOINT: ${WONTON_OIDC_ISSUER}/.well-known/jwks.json
      OIDC_RP_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_RP_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      # 上游默认按邮箱认人，挂上的 custom.py 换成按 sub 认（见 oidc-backend.py）。
      # verify_claims 要求有 email 声明，scope 保持上游默认；邮箱只当资料，登录时同步。
      OIDC_RP_SCOPES: "openid email profile"
      # 主人的管理员账号由 owner-account 服务建（username 是 OIDC 的 sub，云吞的账号名，装好后不变），
      # 不用 LD_SUPERUSER_NAME：bootstrap 里它先于 owner-account 跑，升级时会把旧账号顶掉留下两个号。
      # 不设 LD_SUPERUSER_PASSWORD，密码不可用，只能经 OIDC 进入。装好首次 OIDC 登录就是管理员。
      LD_CSRF_TRUSTED_ORIGINS: ${WONTON_APP_URL}
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/data:/etc/linkding/data
    # 生产设置末尾 `from .custom import *`，上游留了这个挂载点；匹配逻辑单独一个模块，认人时才导入。
    configs:
      - source: custom_settings
        target: /etc/linkding/bookmarks/settings/custom.py
      - source: oidc_backend
        target: /etc/linkding/bookmarks/oidc_backend.py
    # 健康检查：curl 在镜像里有（上游 HEALTHCHECK 同款）；/health 检查数据库。
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  # 一次性服务：等主服务健康后把主人账号的 username 弄成 sub、email 同步成新值。
  # 旧版本的账号 username 是当时的邮箱，改名后原有账号和书签都还在。
  # 幂等，每次启动都跑。
  owner-account:
    image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    entrypoint: ["/bin/sh", "/fix/fix-owner-account.sh"]
    # 镜像自带的 HEALTHCHECK 会 curl 应用（这个容器里没跑 uwsgi，永远失败）。
    healthcheck:
      test: ["NONE"]
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入主人用户名，先在云吞里配好}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入主人邮箱，先在云吞里配好}
    volumes:
      - ${WONTON_APP_DATA}/data:/etc/linkding/data
    configs:
      - source: fix_owner_account
        target: /fix/fix-owner-account.sh
    depends_on:
      linkding:
        condition: service_healthy
    restart: "no"

  # 让核心把 owner-account 当一次性服务（有人等它完成）。
  ready:
    image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    entrypoint: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    depends_on:
      owner-account:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

configs:
  custom_settings:
    file: custom.py
  oidc_backend:
    file: oidc-backend.py
  fix_owner_account:
    file: fix-owner-account.sh

x-wonton:
  spec: "0.4"
  id: app.linkding.linkding
  version: 0.2.0
  kind: app
  title: { zh: 网页书签（Linkding）, en: Web Bookmarks (Linkding) }
  description: { zh: 像浏览器书签，但存在家里、手机电脑通用：存个网址，标题和图标自动带上，以后一搜就有。只管网址，比智能收藏夹更简单。, en: "Like your browser's bookmarks, but kept on your home server and shared across devices: save a link, its title and icon come along, and search finds it later. Links only — simpler than Karakeep." }
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://linkding.link
  license: MIT
  tags: { zh: [工具], en: [Tools] }
  about:
    zh: |
      把网页存进自己的书签库：自动抓标题、描述和图标，打标签、加备注，之后全文搜索。

      用云吞的账号登录：打开就直接进书签页。书签数据存在家里服务器上。
    en: |
      Save web pages into your own bookmark library: titles, descriptions and favicons are fetched automatically. Tag them, add notes and search everything later.

      Sign in with your Wonton account: opening the page takes you straight to your bookmarks. Bookmarks stay on your server at home.
  release_notes:
    zh: 邮箱改了还能进原来的管理员账号：登录改按 OIDC 的 sub 认人，邮箱只当资料，每次登录同步。
    en: "Changing your email no longer locks you out: sign-in now matches the OIDC sub, and the email is only kept as data and synced on each login."
  webui:
    service: linkding
    port: 9090
    # 打开就发起 OIDC 登录，落进书签页，不用多点一下“云吞”按钮。
    path: /oidc/authenticate/
    # OIDC：linkding 官方支持 mozilla-django-oidc（LD_ENABLE_OIDC），回调是上游写死的 /oidc/callback/。
    sso: oidc
    oidc:
      redirect_paths: [/oidc/callback/]
      # 上游 Authelia 示例用 client_secret_post，照它配。
      token_endpoint_auth_method: client_secret_post
  permissions:
    # 抓书签的标题、描述和 favicon 要出网。
    - network.egress
    # 知道用户名和邮箱：管理员账号按用户名（OIDC 的 sub）预建，邮箱同步过去。
    - owner.identity
  # 上游没写最低内存；取 512M（Django + 后台任务进程）。镜像发布 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
